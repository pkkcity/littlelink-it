<!-- ### START script embed vdo youtube ### -->
    <script>
  var modal = document.getElementById("videoModal");
  var iframe = document.getElementById("yt-iframe");

  // ฟังก์ชันนี้จะรับลิงก์ (videoUrl) ที่ส่งมาจากปุ่มที่ถูกคลิก
  function openPopup(e, videoUrl) {
    e.preventDefault(); // ป้องกันไม่ให้หน้าเว็บเด้งกลับไปด้านบน
    iframe.src = videoUrl; // สั่งโหลดวิดีโอตามลิงก์ที่รับมา
    modal.style.display = "flex"; // แสดง Popup
  }

  function closePopup() {
    modal.style.display = "none"; // ซ่อน Popup
    iframe.src = ""; // ถอดลิงก์ออก วิดีโอจะได้หยุดเล่น
  }

  // ปิด Popup เมื่อคลิกพื้นที่สีดำรอบๆ วิดีโอ
  window.onclick = function(event) {
    if (event.target == modal) {
      closePopup();
    }
  }
</script>
<!-- ### END script embed vdo youtube ### -->
